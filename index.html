<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Susu &amp; Neko's Dictation Adventure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 30 L10 16 Q4 30 10 44 Z' fill='%23FF6B7A'/%3E%3Cpath d='M32 30 L54 16 Q60 30 54 44 Z' fill='%23FF6B7A'/%3E%3Ccircle cx='32' cy='30' r='8' fill='%23C3A6FF'/%3E%3C/svg%3E">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#3B2F4A; --muted:#7A6E86;
  --pink:#FF8FB1; --pink-d:#E96B93; --pink-l:#FFE1EA;
  --mint:#6FD3B5; --mint-d:#3FB592; --mint-l:#DDF6EE;
  --sky:#8EC5FF; --sky-d:#5AA6F2; --sky-l:#E2F0FF;
  --sun:#FFD166; --sun-d:#F0B429; --sun-l:#FFF2CC;
  --lav:#C3A6FF; --lav-d:#9E7BEA; --lav-l:#EFE6FF;
  --red:#FF6B6B; --red-l:#FFE3E3;
  --radius:24px; --shadow:0 6px 0 rgba(59,47,74,.12), 0 12px 28px rgba(59,47,74,.08);
  --ui:'Fredoka', 'Nunito', system-ui, sans-serif;
  --word:'Andika', 'Fredoka', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(circle at 10% 10%, #FFE9F0 0 120px, transparent 121px),
    radial-gradient(circle at 92% 18%, #E2F0FF 0 140px, transparent 141px),
    radial-gradient(circle at 85% 92%, #DDF6EE 0 160px, transparent 161px),
    radial-gradient(circle at 6% 85%, #FFF2CC 0 130px, transparent 131px);
  background-attachment:fixed; min-height:100vh; min-height:100dvh;
  font-size:18px; line-height:1.4;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none !important}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand svg{width:44px;height:44px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:var(--shadow)}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;transition:transform .12s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,47,74,.12)}
.top-actions{display:flex;gap:10px;align-items:center}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--card);border-radius:32px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.hero h1{font-size:clamp(26px,4.4vw,40px);margin:0 0 4px;line-height:1.1}
.hero p{margin:0;color:var(--muted)}
.hero-duo{height:190px;width:auto;filter:drop-shadow(0 8px 10px rgba(59,47,74,.15));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.buddy-row{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:0 auto 10px;max-width:760px}
.buddy-row img{height:120px;width:auto;flex:none;filter:drop-shadow(0 5px 6px rgba(59,47,74,.15));transition:transform .2s}
.buddy-row img.jump{animation:jump .6s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) rotate(-3deg)}}
.bubble{position:relative;background:var(--sun-l);border:3px solid var(--sun);border-radius:22px;padding:12px 16px;text-align:left;margin-bottom:34px;font-size:20px;font-weight:600}
.bubble::before{content:"";position:absolute;left:-14px;bottom:14px;border:10px solid transparent;border-right-color:var(--sun);border-left:0}
.bubble .who{display:block;font-size:14px;font-weight:700;color:var(--pink-d);text-transform:uppercase;letter-spacing:.5px}
.bubble.neko{background:var(--lav-l);border-color:var(--lav)} .bubble.neko::before{border-right-color:var(--lav)} .bubble.neko .who{color:var(--lav-d)}
.bubble .instr{margin:0;font-size:20px}
.result-img{height:200px;width:auto}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}92%{transform:rotate(6deg)}}
.speech-bubble{display:inline-block;background:var(--pink-l);border-radius:16px;padding:6px 12px;margin-top:10px;font-weight:500}

/* Map */
.section-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;margin:26px 4px 12px}
.section-title .tag{font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.level{position:relative;background:var(--card);border-radius:var(--radius);padding:16px;text-align:left;box-shadow:var(--shadow);transition:transform .15s;display:flex;flex-direction:column;gap:6px;min-height:150px;border:3px solid transparent}
.level:hover{transform:translateY(-3px)}
.level:active{transform:translateY(2px)}
.level .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff}
.level .name{font-weight:700;font-size:19px;line-height:1.15}
.level .desc{font-size:14px;color:var(--muted);line-height:1.3}
.level .stars{margin-top:auto;font-size:20px;letter-spacing:2px}
.level.locked{opacity:.55;filter:grayscale(.6)}
.level.locked .lock{position:absolute;top:14px;right:14px;font-size:22px}
.level.next{border-color:var(--sun)}
.level.next::after{content:"Try next";position:absolute;top:-10px;right:12px;background:var(--sun);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.c-pink .num{background:var(--pink)} .c-mint .num{background:var(--mint)} .c-sky .num{background:var(--sky)} .c-sun .num{background:var(--sun-d)} .c-lav .num{background:var(--lav)}

.sticker-row{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.sticker{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--bg);border:2px dashed #E3D8CC}
.sticker.got{background:var(--sun-l);border:2px solid var(--sun);animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

.wordbank-btn{margin-top:18px;width:100%;padding:16px;border-radius:var(--radius);background:var(--sky-l);font-weight:700;font-size:19px;box-shadow:var(--shadow)}

/* Game screen */
.game-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px;transition:width .4s}
.game-title{font-weight:700;font-size:18px;white-space:nowrap}
.stage{background:var(--card);border-radius:32px;box-shadow:var(--shadow);padding:22px 18px 26px;text-align:center;position:relative;min-height:420px}
.instr{font-size:20px;font-weight:600;margin:0 0 14px}
.emoji-big{font-size:84px;line-height:1;margin:6px 0 4px}
.word-big{font-family:var(--word);font-size:clamp(40px,8vw,72px);font-weight:700;letter-spacing:1px;margin:4px 0 12px;line-height:1.1;word-break:break-word}
.word-big .l{display:inline-block;transition:transform .15s, color .15s}
.word-big .l.on{color:var(--pink-d);transform:translateY(-10px) scale(1.15)}
.sentence-show{font-family:var(--word);font-size:clamp(20px,3.4vw,28px);background:var(--sky-l);border-radius:18px;padding:12px 16px;margin:10px auto;max-width:720px}
.sentence-show b{color:var(--pink-d)}

.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:14px 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:20px;font-weight:700;font-size:19px;background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--sky-d);transition:transform .1s, box-shadow .1s;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-d)}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lav-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E3D8CC;border:2px solid #E3D8CC}
.btn.big{font-size:22px;padding:18px 30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.speaker{width:110px;height:110px;border-radius:50%;background:var(--pink);box-shadow:0 7px 0 var(--pink-d);display:inline-grid;place-items:center;font-size:52px;color:#fff;margin:6px 0 4px;transition:transform .1s}
.speaker:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pink-d)}
.speaker.talking{animation:pulse 0.9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--pink-d),0 0 0 0 rgba(255,143,177,.6)}50%{box-shadow:0 7px 0 var(--pink-d),0 0 0 18px rgba(255,143,177,0)}}

/* Slots */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 6px;margin:18px auto 8px;max-width:820px}
.slot{width:clamp(40px,7.5vw,58px);height:clamp(52px,9vw,70px);border-radius:14px;background:var(--bg);border:3px solid #E7DCCF;display:grid;place-items:center;font-family:var(--word);font-weight:700;font-size:clamp(28px,5vw,40px);transition:all .15s}
.slot.fixed{background:var(--lav-l);border-color:var(--lav);color:var(--ink)}
.slot.filled{background:#fff;border-color:var(--sky)}
.slot.cur{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-l)}
.slot.ok{background:var(--mint-l);border-color:var(--mint)}
.slot.bad{background:var(--red-l);border-color:var(--red);color:var(--red)}
.slot.gap{width:18px;border:none;background:none}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* Keyboard */
.kbd{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;max-width:640px;margin:16px auto 0}
.key{height:56px;border-radius:14px;background:#fff;border:2px solid #E7DCCF;box-shadow:0 4px 0 #E7DCCF;font-family:var(--word);font-size:26px;font-weight:700;transition:transform .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #E7DCCF}
.key.wide{grid-column:span 2;font-family:var(--ui);font-size:17px;background:var(--sun-l);border-color:var(--sun)}
.key.del{background:var(--pink-l);border-color:var(--pink)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px auto 0;max-width:700px}
.tile{min-width:58px;height:62px;padding:0 12px;border-radius:16px;background:var(--sun-l);border:3px solid var(--sun);box-shadow:0 5px 0 var(--sun-d);font-family:var(--word);font-size:30px;font-weight:700;transition:transform .1s, opacity .2s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-d)}
.tile.used{opacity:.2;pointer-events:none}
.tile.word{font-size:24px;height:56px;background:var(--sky-l);border-color:var(--sky);box-shadow:0 5px 0 var(--sky-d)}

/* Options */
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:760px;margin:18px auto 0}
.opt{padding:20px 14px;border-radius:22px;background:#fff;border:3px solid #E7DCCF;box-shadow:0 5px 0 #E7DCCF;font-family:var(--word);font-size:clamp(24px,4vw,32px);font-weight:700;transition:transform .1s}
.opt:active{transform:translateY(4px)}
.opt.ok{background:var(--mint-l);border-color:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.opt.bad{background:var(--red-l);border-color:var(--red);box-shadow:0 5px 0 var(--red);opacity:.7}

/* Builder */
.answer-line{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:20px;border:3px dashed #E7DCCF;max-width:820px;margin:14px auto 0;background:var(--bg)}
.answer-line .tile.word{background:#fff}
.answer-line .tile.ok{background:var(--mint-l);border-color:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.answer-line .tile.bad{background:var(--red-l);border-color:var(--red);box-shadow:0 5px 0 var(--red)}

/* Typing */
textarea.typer{width:100%;max-width:760px;min-height:120px;border-radius:20px;border:3px solid var(--sky);padding:14px 16px;font-family:var(--word);font-size:26px;color:var(--ink);background:#fff;resize:vertical;outline:none}
textarea.typer:focus{box-shadow:0 0 0 5px var(--sky-l)}
.diff{font-family:var(--word);font-size:24px;max-width:760px;margin:12px auto;line-height:1.7}
.diff span{padding:2px 6px;border-radius:8px;margin:0 2px;display:inline-block}
.diff .w-ok{background:var(--mint-l)}
.diff .w-bad{background:var(--red-l);color:#C0392B;text-decoration:line-through}
.diff .w-miss{background:var(--sun-l);border:2px dashed var(--sun-d)}
.tip{display:inline-block;background:var(--sun-l);border-radius:14px;padding:8px 14px;font-weight:500;margin-top:6px;font-size:17px}

.feedback{min-height:34px;font-size:24px;font-weight:700;margin-top:10px}
.feedback.good{color:var(--mint-d)} .feedback.oops{color:var(--pink-d)}

/* Results */
.result-stars{font-size:70px;letter-spacing:6px;margin:4px 0}
.result-stars span{display:inline-block;animation:pop .5s backwards}
.result-stars span:nth-child(2){animation-delay:.2s}.result-stars span:nth-child(3){animation-delay:.4s}
.review{max-width:720px;margin:16px auto;text-align:left}
.review .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:var(--bg);font-family:var(--word);font-size:20px}
.review .row.ok{background:var(--mint-l)} .review .row.bad{background:var(--red-l)}
.review .row .you{color:#C0392B;font-size:16px;font-family:var(--ui)}
.review .row button{margin-left:auto;font-size:22px}

/* Word bank */
.bank-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.bank-group h3{margin:0 0 10px;font-size:20px}
.bank-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bank-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--bg);font-family:var(--word);font-size:21px;font-weight:700;text-align:left}
.bank-item .e{font-size:28px}
.bank-sent{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--bg);font-family:var(--word);font-size:19px;text-align:left;width:100%;margin-bottom:8px}
.bank-sent .e{font-size:22px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(59,47,74,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:28px;padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow)}
.modal h2{margin:0 0 12px}
.modal label{display:block;font-weight:600;margin:14px 0 6px}
.modal select{width:100%;padding:12px;border-radius:14px;border:2px solid #E7DCCF;font-family:var(--ui);font-size:16px;background:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:14px;border:2px solid #E7DCCF;font-weight:600}
.seg button.on{background:var(--sky-l);border-color:var(--sky)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-weight:600}
.toggle input{width:26px;height:26px}
.note{font-size:14px;color:var(--muted);margin-top:8px}

/* Confetti */
.confetti{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.float-star{position:fixed;z-index:61;font-size:44px;pointer-events:none;animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-90px) scale(1)}}

.counter{font-weight:600;color:var(--muted);font-size:16px;white-space:nowrap}

@media (max-width:560px){
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero-duo{height:150px}
  .buddy-row img{height:90px}
  .bubble,.bubble .instr{font-size:17px}
  .game-title{display:none}
  .kbd{grid-template-columns:repeat(7,1fr);gap:6px}
  .key{height:50px;font-size:23px}
  .stage{padding:18px 10px 22px}
  .btn{padding:12px 16px;font-size:17px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-label="Susu and Neko logo" fill="none">
        <path d="M32 30 L10 16 Q4 30 10 44 Z" fill="#FF6B7A" stroke="#3B2F4A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M32 30 L54 16 Q60 30 54 44 Z" fill="#FF6B7A" stroke="#3B2F4A" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="16" cy="26" r="1.8" fill="#fff"/><circle cx="14" cy="35" r="1.8" fill="#fff"/><circle cx="48" cy="26" r="1.8" fill="#fff"/><circle cx="50" cy="35" r="1.8" fill="#fff"/>
        <circle cx="32" cy="30" r="7" fill="#C3A6FF" stroke="#3B2F4A" stroke-width="3"/>
      </svg>
      <span>Susu &amp; Neko's Dictation</span>
    </div>
    <div class="top-actions">
      <div class="pill" id="starTotal" aria-label="Total stars">⭐ 0</div>
      <button class="iconbtn" id="homeBtn" aria-label="Home" title="Home">🏠</button>
      <button class="iconbtn" id="settingsBtn" aria-label="Voice settings" title="Voice settings">⚙️</button>
    </div>
  </header>

  <main id="app"></main>
</div>

<div class="modal-bg hidden" id="settings">
  <div class="modal" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label>Reading speed</label>
    <div class="seg" id="speedSeg">
      <button data-r="0.65">Slow 🐢</button>
      <button data-r="0.85">Normal 🐰</button>
      <button data-r="1">Quick 🚀</button>
    </div>
    <div class="toggle"><span>Sound effects</span><input type="checkbox" id="sfxToggle" checked></div>
    <p class="note">Susu and Neko use a recorded native English female voice. Slow speed is great for tricky words.</p>
    <div class="btnrow"><button class="btn ghost" id="testVoice">🔊 Test voice</button><button class="btn mint" id="closeSettings">Done</button></div>
  </div>
</div>

<script>
/* ============ CONTENT ============ */
const PART_A = [
  {w:'signs', e:'🪧', s:'We must read the signs in the park.'},
  {w:'care', e:'💗', s:'We must take care of the flowers.'},
  {w:'clean', e:'🧽', s:'We must keep the park clean.'},
  {w:'disturb', e:'🤫', s:'We mustn\'t disturb other people.'},
  {w:'follow', e:'👣', s:'We must follow the rules.'},
  {w:'keep off', e:'🚫', s:'Keep off the grass, please.'},
  {w:'stay', e:'🧍', s:'We must stay on the path.'},
  {w:'trip', e:'🤕', s:'Be careful. You may trip and fall.'},
  {w:'fair', e:'⚖️', s:'It is not fair to cut in line.'},
  {w:'impolite', e:'😤', s:'It is impolite to shout in the library.'},
  {w:'selfish', e:'🙅', s:'Don\'t be selfish. Share with others.'},
  {w:'unsafe', e:'⚠️', s:'It is unsafe to run near the road.'},
];
const PART_B = [
  {w:'litter', e:'🗑️', s:'We mustn\'t litter in the park.'},
  {w:'spit', e:'💦', s:'We mustn\'t spit at the bus stop.'},
  {w:'push', e:'👐', s:'We mustn\'t push on the train.'},
  {w:'rush to the seats', e:'💺', s:'We mustn\'t rush to the seats on the bus.'},
  {w:'talk on the phone', e:'📱', s:'We mustn\'t talk on the phone in the cinema.'},
  {w:'pick the flowers', e:'🌷', s:'We mustn\'t pick the flowers in the park.'},
  {w:'feed the animals', e:'🥕', s:'We mustn\'t feed the animals at the zoo.'},
  {w:'touch the animals', e:'🐐', s:'We mustn\'t touch the animals at the zoo.'},
];
const STRUCTURES = [
  {t:'We must line up at the bus stop.', e:'🚏'},
  {t:'We mustn\'t push on the platform.', e:'🚉'},

let playerDone = null;
function playClip(key, rate){
  return new Promise(res=>{
    if(playerDone) playerDone();
    let done=false; const fin=()=>{ if(!done){ done=true; playerDone=null; res(); } };
    playerDone = fin;
    player.onended=fin; player.onerror=fin;
    player.src='audio/'+key+'.mp3';
    player.playbackRate = rate; player.preservesPitch = true; player.webkitPreservesPitch = true;
    const p = player.play(); if(p && p.catch) p.catch(fin);

}

function scoreVoice(v){
  let s=0; const i = FEMALE.findIndex(r=>r.test(v.name)); if(i>=0) s += 100 - i*3;
  if(/natural/i.test(v.name)) s+=15;
  if(/en-GB/i.test(v.lang)) s+=20; else if(/en-US/i.test(v.lang)) s+=12;
  if(/male|daniel|arthur|ryan|david|mark|george|fred|alex|tom|oliver|rishi/i.test(v.name) && !/female/i.test(v.name)) s-=150;
  return s;
}
function loadVoices(){ if(!synth) return; voices = synth.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>scoreVoice(b)-scoreVoice(a)); }

let speakToken = 0;
function speak(text, opts={}){
  const rate = opts.rate || state.rate;
  const k = akey(text);
  if(AUDIO_KEYS.has(k)) return playClip(k, Math.max(0.6, Math.min(1.25, rate/0.85)));

  return new Promise(res=>{
    if(!synth){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = voices[0]; if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
    u.rate = rate; u.pitch = 1.1;
    let done=false; const fin=()=>{ if(!done){done=true; res();} };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + text.length*180/(u.rate));
    synth.speak(u);
  });
}

async function say(parts, opts={}){
  stopSpeak(); const my = speakToken;
  await new Promise(r=>setTimeout(r,60));
  const btn = opts.btn; btn && btn.classList.add('talking');
  for(const p of [].concat(parts)){
    if(my!==speakToken) break;
    if(typeof p==='number'){ await new Promise(r=>setTimeout(r,p)); continue; }
    await speak(p, opts);
  }
  btn && btn.classList.remove('talking');
  return my===speakToken;
}

async function spellOut(word, onLetter){
  stopSpeak(); const my = speakToken;
  await new Promise(r=>setTimeout(r,60));
  const chars=[...word]; let idx=0;
  await speak(word);
  for(let i=0;i<chars.length;i++){
    if(my!==speakToken) return;
    const c = chars[i];
    if(c===' '){ await new Promise(r=>setTimeout(r,350)); continue; }

    if(AUDIO_KEYS.has('letter_'+c.toLowerCase())) await playClip('letter_'+c.toLowerCase(), 1); else await speak(LETTER_NAMES[c.toLowerCase()]||c);

  if(my===speakToken) await speak(word);

let actx=null;
function tone(freq, dur, type='sine', when=0, vol=0.18){
  if(!state.sfx) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when; const o = actx.createOscillator(); const g = actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}

let G = null; // current game
function startLevel(i){
  const L = LEVELS[i];
  let items = itemsFor(L.items);
  if(L.type==='learn' || L.type==='learnS'){ items=[...items]; }
  else items = shuffle(items);
  if(L.type==='test'){
    const words = shuffle([...PART_A,...PART_B]).slice(0,10).map(x=>({...x,kind:'word'}));
    const sents = shuffle(READING).slice(0,1).map(x=>({...x,kind:'sent'})).concat(shuffle(STRUCTURES).slice(0,1).map(x=>({...x,kind:'sent'})));
    items = [...words, ...sents];
  }
  G = { L, i, items, queue:[...items], done:0, total:items.length, mistakes:0, results:[] };
  nextRound();
}
function shell(inner){
  const pct = Math.round(G.done/G.total*100);

function nextRound(){
  if(G.queue.length===0) return finishLevel();
  buddy = buddy==='susu'?'neko':'susu';
  const item = G.queue[0];
  const t = G.L.type;
  if(t==='learn') roundLearn(item);
  else if(t==='learnS') roundLearnS(item);

/* ---- Letter puzzles: tiles / missing / spell ---- */
function roundLetters(item, mode){
  const target = item.w;
  const chars = [...target];
  const letterIdx = chars.map((c,i)=>c===' '?-1:i).filter(i=>i>=0);
  let blanks;
  if(mode==='missing'){
    const n = Math.max(1, Math.round(letterIdx.length*0.4));
    blanks = new Set(shuffle(letterIdx).slice(0,n));
  } else blanks = new Set(letterIdx);
  const filled = {}; // idx -> letter
  let attempts=0, locked=false, tilesUsed={};
  const order = letterIdx.filter(i=>blanks.has(i));
  let tileLetters = mode==='tiles' ? shuffle(order.map(i=>chars[i])) : null;
  if(tileLetters && tileLetters.join('')===order.map(i=>chars[i]).join('') && tileLetters.length>2) tileLetters = shuffle(tileLetters);

  const instr = {tiles:'Tap the letters in the right order!', missing:'Some letters are hiding. Can you find them?', spell:'Listen and spell the word.'}[mode];
  shell(`<p class="instr">${instr}</p>
    ${mode==='spell'?'':`<div class="emoji-big" style="font-size:64px">${item.e}</div>`}
    <button class="speaker" id="spk" aria-label="Play word" style="${mode==='spell'?'':'width:76px;height:76px;font-size:36px'}">🔊</button>
    <div class="btnrow" style="margin:8px 0">
      <button class="btn ghost" id="slow">🐢 Slowly</button>
      <button class="btn ghost" id="sent">💬 Sentence</button>
      ${mode==='spell'?'<button class="btn ghost" id="hint">💡 Hint</button>':''}
    </div>
    <div class="slots" id="slots"></div>
    <div class="feedback" id="fb"></div>
    <div id="input"></div>`);
  const slotsEl = $('#slots');
  function cur(){ return order.find(i=>filled[i]===undefined); }
  function draw(marks){
    if(!slotsEl.isConnected) return;
    const c = cur();
    slotsEl.innerHTML = chars.map((ch,i)=>{
      if(ch===' ') return '<div class="slot gap"></div>';
      if(!blanks.has(i)) return `<div class="slot fixed">${esc(ch)}</div>`;
      const v = filled[i]; let cls='slot';
      if(v!==undefined) cls+=' filled'; if(i===c && !locked) cls+=' cur';
      if(marks && marks[i]) cls+=' '+marks[i];
      return `<div class="${cls}" data-i="${i}">${v!==undefined?esc(v):''}</div>`;
    }).join('');
  }
  function put(letter, tileK){
    if(locked) return; const c=cur(); if(c===undefined) return;
    sfx.tap(); filled[c]=letter; if(tileK!==undefined) tilesUsed[c]=tileK;
    draw(); drawInput();
    if(cur()===undefined) check();
  }
  function del(){
    if(locked) return;
    const f = order.filter(i=>filled[i]!==undefined); if(!f.length) return;
    const last=f[f.length-1]; delete filled[last]; delete tilesUsed[last]; draw(); drawInput();
  }
  function drawInput(){
    const box=$('#input'); if(!box || !slotsEl.isConnected) return;
    if(mode==='tiles'){
      const used = new Set(Object.values(tilesUsed));
      box.innerHTML = `<div class="tiles">${tileLetters.map((l,k)=>`<button class="tile ${used.has(k)?'used':''}" data-k="${k}">${esc(l)}</button>`).join('')}</div>
        <div class="btnrow"><button class="btn ghost" id="undo">↩️ Undo</button></div>`;
      box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>put(tileLetters[+b.dataset.k], +b.dataset.k));
      $('#undo').onclick=del;
    } else if(!box.dataset.ready){
      box.dataset.ready='1';
      const keys='abcdefghijklmnopqrstuvwxyz'.split('');
      box.innerHTML = `<div class="kbd">${keys.map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key wide del" data-k="del">⌫ Delete</button></div>`;
      box.querySelectorAll('.key').forEach(b=>b.onclick=()=>b.dataset.k==='del'?del():put(b.dataset.k));
    }
  }
  function check(){
    const marks={}; let ok=true;
    order.forEach(i=>{ if(filled[i]===chars[i]) marks[i]='ok'; else { marks[i]='bad'; ok=false; } });
    locked=true; draw(marks);
    if(ok){
      goodFeedback(slotsEl);
      say([target]).then(()=>setTimeout(()=>advance(attempts>0),450));
    } else {
      attempts++;
      if(attempts>=2){
        badFeedback(slotsEl, 'Let\u2019s learn it together. We will try it again later.');
        order.forEach(i=>filled[i]=chars[i]);
        setTimeout(()=>{ draw(Object.fromEntries(order.map(i=>[i,'ok']))); spellOut(target).then(()=>{
          $('#input').innerHTML = `<div class="btnrow"><button class="btn mint big" id="cont">Got it ▶</button></div>`;
          $('#cont').onclick=()=>{ stopSpeak(); advance(true); };
        }); },900);
      } else {
        badFeedback(slotsEl, 'Some letters are wrong. Fix the red ones!');
        setTimeout(()=>{
          order.forEach(i=>{ if(marks[i]==='bad'){ delete filled[i]; delete tilesUsed[i]; } });
          locked=false; draw(); drawInput();
        },1300);
      }
    }
  }
  const play=()=>say(target,{btn:$('#spk')});
  $('#spk').onclick=play;
  $('#slow').onclick=()=>say(target,{rate:0.55,btn:$('#spk')});
  $('#sent').onclick=()=>say([target,300,item.s,300,target],{btn:$('#spk')});
  const h=$('#hint'); if(h) h.onclick=()=>{ const c=cur(); if(c===undefined||locked) return; G.mistakes+=0.5; put(chars[c]); };
  draw(); drawInput();
  keyHandler = e=>{
    if(e.key==='Backspace'){ e.preventDefault(); del(); }
    else if(/^[a-z]$/i.test(e.key) && mode!=='tiles') put(e.key.toLowerCase());
    else if(/^[a-z]$/i.test(e.key) && mode==='tiles'){
      const used=new Set(Object.values(tilesUsed)); const k=tileLetters.findIndex((l,j)=>l===e.key.toLowerCase()&&!used.has(j)); if(k>=0) put(tileLetters[k],k);
    }
  };
  setTimeout(()=>say(mode==='spell'?[target,350,item.s,350,target]:[target],{btn:$('#spk')}),300);
}

/* ---- Sentence typing ---- */
function compareSentences(typed, target){
  const T = norm(target).split(' '), U = norm(typed).split(' ').filter(Boolean);
  // simple LCS alignment
  const m=T.length, n=U.length, dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]= T[i]===U[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  const origT = target.split(' ');
  while(i<m||j<n){
    if(i<m&&j<n&&T[i]===U[j]){ out.push({c:'w-ok',w:origT[i]}); i++; j++; }
    else if(j<n && (i>=m || dp[i][j+1]>=dp[i+1][j])){ out.push({c:'w-bad',w:U[j]}); j++; }
    else { out.push({c:'w-miss',w:origT[i]}); i++; }
  }
  const ok = out.every(o=>o.c==='w-ok');
  const t = typed.trim();
  const tips=[];
  if(t && t[0]!==t[0].toUpperCase()) tips.push('Start with a capital letter.');
  const needEnd = (target.match(/[.!?]/g)||[]).length, haveEnd=(t.match(/[.!?]/g)||[]).length;
  if(haveEnd<needEnd) tips.push('Don\u2019t forget the full stop or exclamation mark.');
  if(/mustn't/i.test(target) && /mustnt|must not/i.test(t.replace(/[’‘]/g,"'"))) tips.push('Write "mustn\u2019t" with an apostrophe.');
  return {ok, out, tips};
}

  if(L.type==='test'){
    const score=G.results.filter(r=>r.ok).length;
    review = `<p class="instr" style="margin-top:10px">Your score: ${score} / ${G.total}</p><div class="review">${G.results.map(r=>`<div class="row ${r.ok?'ok':'bad'}"><span>${r.ok?'✅':'❌'}</span><div>${esc(r.target)}${r.ok?'':`<div class="you">You wrote: ${esc(r.you)}</div>`}</div><button aria-label="Hear" data-t="${esc(r.target)}">🔊</button></div>`).join('')}</div>`;
  }
  const msg = stars===3?'Perfect! Susu and Neko say you are a superstar!':stars===2?'Great work! Play again with Susu and Neko for 3 stars.':'Good try! Susu and Neko will practise with you again.';
  app.innerHTML = `<section class="stage" style="padding-top:28px">
    <img class="result-img" src="${IMG.cheer}" alt="Susu and Neko celebrating">
    <h2 style="font-size:34px;margin:6px 0">Level ${G.i+1} complete!</h2>
    <div class="result-stars">${'<span>⭐</span>'.repeat(stars)}${'<span style="opacity:.2">⭐</span>'.repeat(3-stars)}</div>
    <p class="instr">${msg}</p>
    ${!prev?`<p>You got a new sticker: <span style="font-size:40px;vertical-align:middle">${L.sticker}</span></p>`:''}
    ${review}
    <div class="btnrow">
      <button class="btn ghost" id="again">🔁 Play again</button>
      <button class="btn sun" id="map">🗺️ Level map</button>
      ${next?`<button class="btn mint big" id="nextL">Next level ▶</button>`:''}
    </div>
  </section>`;
  sfx.win(); confetti(stars*30);
  say(msg);
  app.querySelectorAll('.review button').forEach(b=>b.onclick=()=>say(b.dataset.t));
  $('#again').onclick=()=>startLevel(G.i);
  $('#map').onclick=renderHome;
  if(next) $('#nextL').onclick=()=>startLevel(G.i+1);
  window.scrollTo({top:0});
}

/* ============ SETTINGS ============ */
function openSettings(){
  loadVoices();
  document.querySelectorAll('#speedSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.r===state.rate));
  $('#sfxToggle').checked=state.sfx;
  $('#settings').classList.remove('hidden');
}
$('#settingsBtn').onclick=openSettings;
$('#closeSettings').onclick=()=>{ $('#settings').classList.add('hidden'); save(); if(!G || !app.querySelector('.stage')) renderHome(); };
$('#settings').onclick=e=>{ if(e.target.id==='settings') $('#closeSettings').click(); };
document.querySelectorAll('#speedSeg button').forEach(b=>b.onclick=()=>{ state.rate=+b.dataset.r; document.querySelectorAll('#speedSeg button').forEach(x=>x.classList.toggle('on',x===b)); save(); say(['signs',250,'impolite',250,'talk on the phone']); });
$('#sfxToggle').onchange=e=>{ state.sfx=e.target.checked; save(); };
$('#testVoice').onclick=()=>say('Hello Clarice! I am Neko. We mustn\u2019t push on the train.');
$('#homeBtn').onclick=()=>{ keyHandler=null; renderHome(); };

renderHome();
</script>
